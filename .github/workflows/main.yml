name: CI/CD Pipeline

on:
  push:
    branches:
      - 'Infrastructure'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # with:
          # fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run tests
        run: |
          pytest


      #       git commit -m "ci: update images' tags to $IMAGE_TAG"
      #       git push
      #     fi
